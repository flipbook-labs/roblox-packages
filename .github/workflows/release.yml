name: Release

on:
  push:
    branches: [main]
  pull_request:
    types: [
        opened,
        synchronize,
        reopened,
        # We include `labeled` so that tagging the PR with `debug:release-pr`
        # will trigger a debug version of the release workflow.
        labeled,
      ]
  workflow_dispatch:
    inputs:
      force-version:
        description: "Open a publish PR that sets this exact version (e.g. 1.2.3)"
        default: ""
        required: false

defaults:
  run:
    shell: bash

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from manifest
        id: get_version
        run: |
          PACKAGE_VERSION=$(cargo read-manifest | jq -r .version)
          echo "value=${PACKAGE_VERSION}" >> $GITHUB_OUTPUT

  build:
    needs: ["init"]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            runner-os: windows-2022
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-windows-x86_64
            cargo-target: x86_64-pc-windows-msvc

          - name: Windows aarch64
            runner-os: windows-11-arm
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-windows-aarch64
            cargo-target: aarch64-pc-windows-msvc

          - name: Linux x86_64
            runner-os: ubuntu-22.04
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-linux-x86_64
            cargo-target: x86_64-unknown-linux-gnu

          - name: Linux aarch64
            runner-os: ubuntu-22.04-arm
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-linux-aarch64
            cargo-target: aarch64-unknown-linux-gnu

          - name: macOS x86_64
            runner-os: macos-15
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-macos-x86_64
            cargo-target: x86_64-apple-darwin

          - name: macOS aarch64
            runner-os: macos-15
            artifact-name: roblox-packages-${{ needs.init.outputs.version }}-macos-aarch64
            cargo-target: aarch64-apple-darwin

    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.runner-os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.cargo-target }}

      - name: Build binary
        run: |
          cargo build \
          --locked --all-features \
          --release --target ${{ matrix.cargo-target }}

      - name: Create release archive
        run: ./scripts/zip-release.sh ${{ matrix.cargo-target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: release.zip

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ["init", "build"]
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'debug:release-pr')
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-pr-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.FLIPBOOK_BACKEND_APP_ID }}
          private-key: ${{ secrets.FLIPBOOK_BACKEND_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Unpack releases
        if: github.event_name != 'pull_request'
        run: ./scripts/unpack-releases.sh "./releases"

      - id: changewrite
        uses: flipbook-labs/changewrite@v0.5.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-token: ${{ steps.app-token.outputs.token }}
          force-version: ${{ inputs.force-version || '' }}
          base: main
          branch: ${{ github.event_name == 'pull_request' && 'debug-publish-next-version' || 'publish-next-version' }}
          prepare-only: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'debug:release-pr') }}
          post-draft-hook: |
            "$CHANGEWRITE_BIN" attach --tag "$CHANGEWRITE_TAG" --files releases/*.zip
          pr-title: ${{ github.event_name == 'pull_request' && '[DEBUG] Publish v{{version}}' || 'Publish v{{version}}' }}
          pr-body: |
            >[!IMPORTANT]
            > This PR prepares the next release by bumping the version and updating the changelog.
            >
            > **Merging this PR will:**
            >
            > 1. Create and push tag `{{tag}}`
            > 2. Create a GitHub release for that tag
            > 3. Attach the cross-platform binaries to the release

            <details>
            <summary><b>GitHub Release preview</b></summary>

            # {{tag}}

            {{notes}}
            </details>

            Next release will be available here:
            {{repo_url}}/releases/tag/{{tag}}

            This PR was generated by [this run]({{run_url}}).
